name: Infrastructure CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fmt:
    name: Terraform format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff infra

  validate:
    name: Terraform validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir:
          - infra                               
          - infra/terraform/environments/dev    # S3 + Lambda + API stack
          # - infra/terraform/environments/staging
          # - infra/terraform/environments/prod
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      # -backend=false: no AWS credentials or remote state needed in CI
      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0

      - name: Lint all Terraform folders
        working-directory: infra
        run: tflint --recursive --format compact

  security:
    name: Security scan (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install "checkov==3.3.20"

      # --soft-fail: report findings without failing the build.
      # Remove it once existing findings are fixed or suppressed.
      - name: Scan Terraform
        run: checkov -d infra --framework terraform --compact --quiet --soft-fail

  lambda:
    name: Lambda code (ruff + compile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"   # matches the Lambda runtime

      - name: Install ruff
        run: pip install "ruff==0.16.9"

      - name: Lint
        run: ruff check infra/lambdas

      - name: Byte-compile
        run: python -m compileall -q infra/lambdas

  # The single check to require in branch protection.
  gate:
    name: Infra CI gate
    if: always()
    needs: [fmt, validate, tflint, security, lambda]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "A job failed or was cancelled."; exit 1 ;;
          esac